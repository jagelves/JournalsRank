<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IO Journal Ranker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a data strip (source year and upload), a toolbar, then one sortable table; the SJR column carries a scaled bar so magnitude reads before the digits do. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#151a22; --ink2:#47505e; --muted:#6f7a8b;
  --line:#e0e4ea; --hover:#f0f3f8; --accent:#25499a; --accent-ink:#ffffff; --accent-soft:#e5ebf8;
  --bar:#8aa2d6; --info-bg:#eaf0f8; --info-ink:#2c3e5c; --up:#17714a; --down:#a93a2a;
  --warn-bg:#f6efdc; --warn-ink:#5d4b13;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1218; --surface:#151a22; --ink:#e7ebf2; --ink2:#a9b2c0; --muted:#8792a3;
    --line:#262d39; --hover:#1b222d; --accent:#8fb0f5; --accent-ink:#0e1218; --accent-soft:#1c2a47;
    --bar:#4d6cae; --info-bg:#18202e; --info-ink:#b4c3dd; --up:#5fc994; --down:#f0907d;
    --warn-bg:#262212; --warn-ink:#d9c78a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#151a22; --ink:#e7ebf2; --ink2:#a9b2c0; --muted:#8792a3;
  --line:#262d39; --hover:#1b222d; --accent:#8fb0f5; --accent-ink:#0e1218; --accent-soft:#1c2a47;
  --bar:#4d6cae; --info-bg:#18202e; --info-ink:#b4c3dd; --up:#5fc994; --down:#f0907d;
  --warn-bg:#262212; --warn-ink:#d9c78a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5;
  padding-block:28px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.page{max-width:1040px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1{font-size:22px; font-weight:600; letter-spacing:-0.01em; margin:0; text-wrap:balance}
.sub{margin:4px 0 0; color:var(--ink2); max-width:68ch}
.strip{background:var(--info-bg); color:var(--info-ink); border-radius:6px; padding:10px 12px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center}
.strip .txt{flex:1 1 280px; min-width:0; font-size:13px}
.strip .btns{display:flex; gap:8px; flex-wrap:wrap}
.msg{border-radius:6px; padding:10px 12px; font-size:13px; max-width:80ch}
.msg.ok{background:var(--info-bg); color:var(--info-ink)}
.msg.warn{background:var(--warn-bg); color:var(--warn-ink)}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.search{flex:1 1 240px; min-width:0}
.search input{
  width:100%; font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:6px; padding:9px 12px;
}
select{
  font:inherit; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:6px; padding:9px 10px;
}
.toggle, .btn{
  font:inherit; color:var(--ink2); background:var(--surface); border:1px solid var(--line);
  border-radius:6px; padding:9px 12px; cursor:pointer; display:inline-block;
}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:500}
.toggle[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.toggle:hover, .btn:hover{border-color:var(--muted)}
input:focus-visible, select:focus-visible, button:focus-visible, label.btn:focus-within{outline:2px solid var(--accent); outline-offset:2px}
input[type="file"]{position:absolute; width:1px; height:1px; opacity:0; overflow:hidden}
.meta{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:13px}
.tablewrap{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:780px}
th, td{padding:10px 12px; text-align:left; vertical-align:middle; border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
th{font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); white-space:nowrap; padding-block:8px}
th button{
  all:unset; cursor:pointer; display:inline-flex; gap:6px; align-items:center;
  text-transform:inherit; letter-spacing:inherit; color:inherit; font:inherit;
}
th button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
th[aria-sort="ascending"] button, th[aria-sort="descending"] button{color:var(--ink)}
.num{font-family:var(--font-num); font-variant-numeric:tabular-nums}
td.r, th.r{text-align:right}
.rank{color:var(--muted); width:40px}
.name{min-width:0; font-weight:500}
.chips{display:inline-flex; gap:6px; margin-left:8px; vertical-align:1px}
.chip{font-size:11px; font-weight:500; padding:1px 7px; border-radius:99px; background:var(--accent-soft); color:var(--accent); white-space:nowrap}
.chip.out{background:transparent; border:1px solid var(--accent)}
.sjr{display:flex; align-items:center; gap:10px; min-width:160px}
.sjr .v{width:52px; text-align:right; font-weight:500}
.track{flex:1; height:6px; border-radius:3px; background:var(--hover)}
.fill{height:100%; border-radius:3px; background:var(--bar)}
.up{color:var(--up)} .down{color:var(--down)} .dash{color:var(--muted)}
.empty{padding:36px 16px; text-align:center; color:var(--muted)}
.foot{color:var(--muted); font-size:12.5px; max-width:80ch; margin:0}
@media (prefers-reduced-motion: no-preference){ .fill{transition:width .25s ease} }
</style>
</head>

/*PURE-START*/
function normTitle(s) {
  return String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/&/g, "and").replace(/[^a-z0-9 ]/g, "").trim();
}

function parseCsv(text) {
  text = text.replace(/^﻿/, "");
  const nl = text.indexOf("\n");
  const head = nl < 0 ? text : text.slice(0, nl);
  const delim = (head.match(/;/g) || []).length > (head.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], field = "", inq = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inq) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inq = false; }
      else field += ch;
    } else if (ch === '"') inq = true;
    else if (ch === delim) { row.push(field); field = ""; }
    else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== "\r") field += ch;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const toNum = s => { const n = parseFloat(String(s).replace(",", ".")); return isNaN(n) ? null : n; };

/* Reads a SCImago journal-rank CSV and returns the entries for the titles in `watch`. */
function extract(text, watch) {
  const rows = parseCsv(text);
  if (rows.length < 2) throw new Error("The file has no data rows.");
  const hdr = rows[0].map(h => h.trim());
  const col = name => hdr.indexOf(name);
  const iTitle = col("Title"), iSjr = col("SJR"), iQ = col("SJR Best Quartile"), iH = col("H index");
  const iCpd = col("Citations / Doc. (2years)"), iType = col("Type");
  let iDocs = -1, year = null;
  hdr.forEach((h, i) => { const m = h.match(/^Total Docs\. \((\d{4})\)$/); if (m && iDocs < 0) { iDocs = i; year = Number(m[1]); } });
  if (iTitle < 0 || iSjr < 0 || iDocs < 0)
    throw new Error("This does not look like a SCImago journal rank export (missing Title, SJR or Total Docs columns).");
  const want = new Map(watch.map(w => [normTitle(w.t), w]));
  const found = {};
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r]; if (row.length < hdr.length - 2) continue;
    const key = normTitle(row[iTitle]);
    if (!want.has(key)) continue;
    const isJournal = iType < 0 || row[iType] === "journal";
    if (found[key] && !(isJournal && !found[key].journal)) continue;
    found[key] = { journal: isJournal, s: toNum(row[iSjr]), q: iQ < 0 ? "" : row[iQ],
      h: iH < 0 ? null : toNum(row[iH]), n: toNum(row[iDocs]), cpd: iCpd < 0 ? null : toNum(row[iCpd]) };
  }
  const vals = {}, missing = [];
  watch.forEach(w => {
    const k = normTitle(w.t), f = found[k];
    if (f && f.s != null) vals[k] = { s: f.s, q: f.q, h: f.h, n: f.n, cpd: f.cpd }; else missing.push(w.j);
  });
  return { year, vals, missing };
}
/*PURE-END*/

const STORE = "ioRanker.v1";
function loadStore() {
  try {
    const o = JSON.parse(localStorage.getItem(STORE));
    if (o && o.cur && o.cur.year && o.cur.vals) return o;
  } catch (e) {}
  return null;
}
function saveStore(o) { try { localStorage.setItem(STORE, JSON.stringify(o)); } catch (e) {} }
function clearStore() { try { localStorage.removeItem(STORE); } catch (e) {} }

const BANDS = [
  ["all", "All SJR", () => true],
  ["hi", "2.0 and above", r => r.s >= 2],
  ["mid", "1.0 to 2.0", r => r.s >= 1 && r.s < 2],
  ["low", "0.5 to 1.0", r => r.s >= 0.5 && r.s < 1],
  ["vlow", "Below 0.5", r => r.s < 0.5]
];

function val(r, k) { return k === "q" ? Number((r.q || "Q9")[1]) : r[k]; }
const fmt = (n, d) => n == null ? "-" : n.toFixed(d);

function Sjr({ r, max }) {
  const w = (Math.sqrt(r.s) / max) * 100;
  return html`<div class="sjr">
    <span class="v num">${r.s.toFixed(3)}</span>
    <div class="track"><div class="fill" style=${{ width: w + "%" }}></div></div>
  </div>`;
}

function Delta({ d }) {
  if (d == null) return html`<span class="dash">-</span>`;
  if (Math.abs(d) < 0.0005) return html`<span class="num">0.000</span>`;
  const up = d > 0;
  return html`<span class=${"num " + (up ? "up" : "down")}>${up ? "▲ +" : "▼ "}${d.toFixed(3)}</span>`;
}

function App() {
  const [store, setStore] = useState(() => loadStore() || { cur: BUILTIN, prior: null });
  const [note, setNote] = useState(null);
  const [q, setQ] = useState("");
  const [band, setBand] = useState("all");
  const [io, setIo] = useState(false);
  const [mine, setMine] = useState(false);
  const [ref, setRef] = useState(false);
  const [added, setAdded] = useState(false);
  const [sort, setSort] = useState({ k: "s", dir: "desc" });

  const { cur, prior } = store;
  const hasPrior = !!prior;

  const ranked = useMemo(() => {
    const base = WATCH.map(w => {
      const k = normTitle(w.t), v = cur.vals[k];
      if (!v) return null;
      const p = prior && prior.vals[k];
      return { ...w, ...v, d: p ? Math.round((v.s - p.s) * 1000) / 1000 : null };
    }).filter(Boolean);
    base.sort((a, b) => b.s - a.s);
    return base.map((r, i) => ({ ...r, rank: i + 1 }));
  }, [cur, prior]);

  const maxS = Math.sqrt(Math.max(1, ...ranked.map(r => r.s)));

  const rows = useMemo(() => {
    const test = BANDS.find(b => b[0] === band)[2];
    const needle = q.trim().toLowerCase();
    const out = ranked.filter(r =>
      test(r) && (!io || r.c) && (!mine || r.pub) && (!ref || r.ref) && (!added || r.add) &&
      (!needle || r.j.toLowerCase().includes(needle)));
    const f = sort.dir === "asc" ? 1 : -1;
    out.sort((a, b) => {
      if (sort.k === "j") return f * a.j.localeCompare(b.j);
      const x = val(a, sort.k), y = val(b, sort.k);
      if (x == null && y == null) return a.rank - b.rank;
      if (x == null) return 1;
      if (y == null) return -1;
      return x === y ? a.rank - b.rank : f * (x - y);
    });
    return out;
  }, [ranked, q, band, io, mine, ref, added, sort]);

  const cols = [
    { k: "s", label: "SJR " + cur.year, cls: "" },
    ...(hasPrior ? [{ k: "d", label: "vs " + prior.year, cls: "r" }] : []),
    { k: "q", label: "Quartile", cls: "" },
    { k: "h", label: "h-index", cls: "r" },
    { k: "cpd", label: "Cites / doc", cls: "r" },
    { k: "n", label: "Docs " + cur.year, cls: "r" }
  ];

  const setKey = k => setSort(s => s.k === k
    ? { k, dir: s.dir === "asc" ? "desc" : "asc" }
    : { k, dir: k === "j" || k === "q" ? "asc" : "desc" });

  const onFile = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const rd = new FileReader();
    rd.onerror = () => setNote({ kind: "warn", text: "The file could not be read." });
    rd.onload = () => {
      try {
        const res = extract(String(rd.result), WATCH);
        if (Object.keys(res.vals).length === 0)
          throw new Error("None of your journals were found in that file.");
        const entry = { year: res.year, vals: res.vals };
        let next, how;
        if (res.year > cur.year) { next = { cur: entry, prior: cur }; how = "Kept " + cur.year + " for the comparison column."; }
        else if (res.year === cur.year) { next = { cur: entry, prior: store.prior }; how = "Replaced the " + res.year + " data."; }
        else { next = { cur: cur, prior: entry }; how = "That file is older than the current data, so it is used for the comparison column."; }
        setStore(next); saveStore(next);
        const n = Object.keys(res.vals).length;
        setNote({ kind: res.missing.length ? "warn" : "ok",
          text: "Loaded SJR " + res.year + ": " + n + " of " + WATCH.length + " journals found. " + how +
            (res.missing.length ? " Not found in the file (renamed, merged or dropped?): " + res.missing.join("; ") + "." : "") });
      } catch (err) {
        setNote({ kind: "warn", text: err.message || "The file could not be read." });
      }
    };
    rd.readAsText(file);
  };

  const reset = () => { clearStore(); setStore({ cur: BUILTIN, prior: null }); setNote({ kind: "ok", text: "Back to the built-in SJR " + BUILTIN.year + " data." }); };

  const downloadCsv = () => {
    const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
    const head = ["rank", "journal", "sjr_" + cur.year, ...(hasPrior ? ["change_vs_" + prior.year] : []),
      "best_quartile", "h_index", "docs_" + cur.year, "cites_per_doc_2y", "io_focused", "published", "refereed", "added"];
    const lines = [head.join(",")].concat(rows.map(r => [r.rank, esc(r.j), r.s, ...(hasPrior ? [r.d ?? ""] : []),
      r.q, r.h ?? "", r.n ?? "", r.cpd ?? "", r.c ? 1 : 0, r.pub ? 1 : 0, r.ref ? 1 : 0, r.add ? 1 : 0].join(",")));
    const blob = new Blob([lines.join("\n") + "\n"], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "io_journals_sjr_" + cur.year + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  const ariaSort = k => sort.k === k ? (sort.dir === "asc" ? "ascending" : "descending") : "none";
  const arrow = k => sort.k === k ? (sort.dir === "asc" ? "▲" : "▼") : "";
  const isBuiltin = !loadStore();

  return html`<div class="page">
    <header>
      <h1>IO Journal Ranker</h1>
      <p class="sub">${ranked.length} economics journals for a theoretical industrial organization paper, ranked by SCImago SJR ${cur.year}.</p>
    </header>

    <div class="strip">
      <div class="txt">Showing SJR ${cur.year}${isBuiltin ? " (built-in data)" : " (from your upload)"}${hasPrior ? ", compared with " + prior.year : ""}. Each year, download the journal rankings CSV from scimagojr.com and upload it here.</div>
      <div class="btns">
        <label class="btn primary">Upload SCImago CSV<input id="file" type="file" accept=".csv,text/csv" onChange=${onFile} /></label>
        ${isBuiltin ? null : html`<button class="btn" onClick=${reset}>Reset</button>`}
      </div>
    </div>

    ${note ? html`<div class=${"msg " + note.kind} role="status">${note.text}</div>` : null}

    <div class="toolbar">
      <div class="search">
        <input id="q" type="search" placeholder="Search journals" aria-label="Search journals"
          value=${q} onInput=${e => setQ(e.target.value)} />
      </div>
      <select id="band" aria-label="Filter by SJR range" value=${band} onChange=${e => setBand(e.target.value)}>
        ${BANDS.map(b => html`<option key=${b[0]} value=${b[0]}>${b[1]}</option>`)}
      </select>
      <button class="toggle" aria-pressed=${io} onClick=${() => setIo(v => !v)}>IO-focused</button>
      <button class="toggle" aria-pressed=${mine} onClick=${() => setMine(v => !v)}>Published here</button>
      <button class="toggle" aria-pressed=${ref} onClick=${() => setRef(v => !v)}>Refereed for</button>
      <button class="toggle" aria-pressed=${added} onClick=${() => setAdded(v => !v)}>Newly added</button>
      <button class="btn" onClick=${downloadCsv}>Download CSV</button>
    </div>

    <div class="meta">
      <span>${rows.length} of ${ranked.length} journals</span>
      <span>Bar length is square-root scaled</span>
    </div>

    <div class="tablewrap">
      <table>
        <thead><tr>
          <th class="rank">#</th>
          <th aria-sort=${ariaSort("j")}><button onClick=${() => setKey("j")}>Journal ${arrow("j")}</button></th>
          ${cols.map(c => html`<th key=${c.k} class=${c.cls} aria-sort=${ariaSort(c.k)}>
            <button onClick=${() => setKey(c.k)}>${c.label} ${arrow(c.k)}</button></th>`)}
        </tr></thead>
        <tbody>
          ${rows.map(r => html`<tr key=${r.j}>
            <td class="rank num">${r.rank}</td>
            <td class="name">${r.j}<span class="chips">
              ${r.c ? html`<span class="chip">IO</span>` : null}
              ${r.pub ? html`<span class="chip out">Published</span>` : null}
              ${r.ref ? html`<span class="chip out">Referee</span>` : null}
              ${r.add ? html`<span class="chip out">New</span>` : null}
            </span></td>
            <td><${Sjr} r=${r} max=${maxS} /></td>
            ${hasPrior ? html`<td class="r"><${Delta} d=${r.d} /></td>` : null}
            <td><span class="num">${r.q || "-"}</span></td>
            <td class="r num">${fmt(r.h, 0)}</td>
            <td class="r num">${fmt(r.cpd, 2)}</td>
            <td class="r num">${fmt(r.n, 0)}</td>
          </tr>`)}
        </tbody>
      </table>
      ${rows.length === 0 ? html`<div class="empty">No journals match. Clear the search or a filter.</div>` : null}
    </div>

    <p class="foot">Uploaded data stays in this browser only. "IO-focused" is a judgment about subject scope, not a SCImago category. Quartile is each journal's best quartile across its subject categories. To add or drop journals, or change tags, edit the WATCH list near the top of this file's script.</p>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
